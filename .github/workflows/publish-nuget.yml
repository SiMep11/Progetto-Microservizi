name: Creazione e Pubblicazione NuGet

on:
  push:
    branches: [ "main" ] # Si attiva quando fai un push sul branch principale

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.PAT_GITHUB }}
    
    # servono a GitHub per scrivere nei Packages
    permissions:
      packages: write
      contents: read

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4
      
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 
        
    - name: Pacchettizza Magazzino.Shared
      run: dotnet pack Microservizi/Magazzino/Magazzino.Shared/Magazzino.Shared.csproj -c Release -o pacchetti_creati
      
    - name: Pacchettizza Magazzino.ClientHttp
      run: dotnet pack Microservizi/Magazzino/Magazzino.ClientHttp/Magazzino.ClientHttp.csproj -c Release -o pacchetti_creati
      
    - name: Pacchettizza UtilityKafka
      run: dotnet pack UtilityKafka/UtilityKafka.csproj -c Release -o pacchetti_creati

    - name: Pacchettizza Pagamenti.Shared
      run: dotnet pack Microservizi/Pagamenti/Pagamenti.Shared/Pagamenti.Shared.csproj -c Release -o pacchetti_creati

    - name: Pacchettizza Ordini.Shared
      run: dotnet pack Microservizi/Ordini/Ordini.Shared/Ordini.Shared.csproj -c Release -o pacchetti_creati

    - name: Pacchettizza Ordini.ClientHttp
      run: dotnet pack Microservizi/Ordini/Ordini.ClientHttp/Ordini.ClientHttp.csproj -c Release -o pacchetti_creati

    - name: Pacchettizza Approvvigionamenti.Shared
      run: dotnet pack Microservizi/Approvvigionamenti/Approvvigionamenti.Shared/Approvvigionamenti.Shared.csproj -c Release -o pacchetti_creati

    - name: Pacchettizza Approvvigionamenti.ClientHttp
      run: dotnet pack Microservizi/Approvvigionamenti/Approvvigionamenti.ClientHttp/Approvvigionamenti.ClientHttp.csproj -c Release -o pacchetti_creati

    - name: Pubblica su GitHub Packages
      run: dotnet nuget push "pacchetti_creati/*.nupkg" --api-key ${{ secrets.PAT_GITHUB }} --source "https://nuget.pkg.github.com/SiMep11/index.json" --skip-duplicate