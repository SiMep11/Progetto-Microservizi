name: Build e Pubblicazione Immagine Docker

on:
  push:
    branches: [ "main" ] # Si attiva ad ogni push sul main

jobs:
  build-and-publish-docker:
    runs-on: ubuntu-latest

    # Permessi necessari per caricare l'immagine su GitHub Packages
    permissions:
      packages: write
      contents: read

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Login al GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }} # Questo rimane GITHUB_TOKEN (automatico)

    - name: Build e Push dell'immagine Magazzino
      run: |
        docker build --build-arg GH_TOKEN=${{ secrets.PAT_GITHUB }} -f Microservizi/Magazzino/Magazzino.WebApi/Dockerfile -t ghcr.io/simep11/magazzino-api:latest Microservizi/Magazzino/
        docker push ghcr.io/simep11/magazzino-api:latest

    - name: Build e Push dell'immagine Ordini
      run: |
        docker build --build-arg GH_TOKEN=${{ secrets.PAT_GITHUB }} -f Microservizi/Ordini/Ordini.WebApi/Dockerfile -t ghcr.io/simep11/ordini-api:latest Microservizi/Ordini/
        docker push ghcr.io/simep11/ordini-api:latest

    - name: Build e Push dell'immagine Pagamenti
      run: |
        docker build --build-arg GH_TOKEN=${{ secrets.PAT_GITHUB }} -f Microservizi/Pagamenti/Pagamenti.WebApi/Dockerfile -t ghcr.io/simep11/pagamenti-api:latest Microservizi/Pagamenti/
        docker push ghcr.io/simep11/pagamenti-api:latest