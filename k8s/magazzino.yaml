apiVersion: apps/v1
kind: Deployment
metadata:
  name: magazzino-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: magazzino-api
  template:
    metadata:
      labels:
        app: magazzino-api
    spec:
      containers:
      - name: magazzino-api
        image: ghcr.io/simep11/magazzino-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
          # Sovrascrivo la stringa di connessione per fargli puntare al container SQL
          - name: ConnectionStrings__MagazzinoDb
            value: "Server=sqlserver-service,1433;Database=MagazzinoDb;User Id=sa;Password=TuaPasswordSicura123!;TrustServerCertificate=True;"
          # serve per mostrare l'interfaccia Swagger 
          - name: ASPNETCORE_ENVIRONMENT
            value: "Development"
          - name: Kafka__BootstrapServers
            value: "kafka-service:9092" # Usa il nome del Service di Kafka!
          - name: Kafka__AdminClient__BootstrapServers
            value: "kafka-service:9092"
          - name: Kafka__ConsumerClient__BootstrapServers
            value: "kafka-service:9092"
          - name: Kafka__ConsumerClient__GroupId
            value: "magazzino-group"
          - name: Kafka__Topics__OrdineConfermato
            value: "ordine-confermato"
          - name: Kafka__Topics__MerceRicevuta
            value: "merce-ricevuta"
---
apiVersion: v1
kind: Service
metadata:
  name: magazzino-service
spec:
  type: LoadBalancer
  selector:
    app: magazzino-api
  ports:
  - port: 8080
    targetPort: 8080